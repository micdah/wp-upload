name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check formatting & linting
        run: npm run check

      - name: Typecheck server
        run: npm run typecheck -w server

      - name: Test server
        run: npm run test -w server

      - name: Typecheck client
        run: npm run typecheck -w client

      - name: Build client
        run: npm run build

  docker:
    name: Build & run Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: wp-upload:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name wp-upload-ci -p 3001:3001 \
            -e WP_URL=https://example.invalid \
            -e WP_USERNAME=ci-user \
            -e WP_APP_PASSWORD="ci-app-password" \
            -e AUTH_USERNAME=ci-user \
            -e AUTH_PASSWORD=ci-password-not-real \
            wp-upload:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/healthz > /dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not become healthy in time" >&2
          docker logs wp-upload-ci
          exit 1

      - name: Verify Basic Auth is enforced
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/status)
          if [ "$status" != "401" ]; then
            echo "Expected 401 from an unauthenticated request to /api/status, got $status" >&2
            docker logs wp-upload-ci
            exit 1
          fi

      - name: Verify authenticated request succeeds
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -u ci-user:ci-password-not-real http://localhost:3001/api/status)
          if [ "$status" != "200" ]; then
            echo "Expected 200 from an authenticated request to /api/status, got $status" >&2
            docker logs wp-upload-ci
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs wp-upload-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f wp-upload-ci || true
