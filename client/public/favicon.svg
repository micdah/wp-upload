<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nyan-cat-inspired unicorn favicon">
  <defs>
    <linearGradient id="nyanHorn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0070e0" />
      <stop offset="100%" stop-color="#b3fbff" />
    </linearGradient>
    <radialGradient id="nyanBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbe4ff" />
    </radialGradient>
  </defs>

  <style>
    .nyan-star {
      transform-origin: center;
      animation: nyan-twinkle 1.6s ease-in-out infinite;
    }
    .nyan-star-a {
      animation-delay: 0s;
    }
    .nyan-star-b {
      animation-delay: 0.8s;
    }
    @keyframes nyan-twinkle {
      0%,
      100% {
        opacity: 0.25;
        transform: scale(0.7);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>

  <circle cx="35" cy="36" r="20" fill="url(#nyanBody)" stroke="#b8c7ff" stroke-width="1.5" />

  <path d="M 21 23 L 25 11 L 30 21 Z" fill="#eef1ff" stroke="#b8c7ff" stroke-width="1" />
  <path d="M 31 20 L 35 2 L 39 20 Z" fill="url(#nyanHorn)" />

  <g>
    <circle cx="18" cy="26" r="6" fill="#ff2d6f" />
    <circle cx="14" cy="36" r="6" fill="#ffe14d" />
    <circle cx="16" cy="47" r="6" fill="#00c2ff" />
    <circle cx="22" cy="55" r="6" fill="#7c4dff" />
  </g>

  <circle cx="43" cy="34" r="2.2" fill="#12202f" />
  <circle cx="52" cy="42" r="3" fill="#ff9ac2" opacity="0.7" />
  <path d="M 42 42 Q 45 45 48 42" stroke="#12202f" stroke-width="1.4" fill="none" stroke-linecap="round" />

  <path class="nyan-star nyan-star-a" d="M52 4 L54 10 L60 10 L55 14 L57 20 L52 16 L47 20 L49 14 L44 10 L50 10 Z" fill="#e6feff" />
  <path class="nyan-star nyan-star-b" d="M10 48 L11 51 L14 51 L11.5 53 L12.5 56 L10 54 L7.5 56 L8.5 53 L6 51 L9 51 Z" fill="#e6feff" />
</svg>
