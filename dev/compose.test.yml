# `test` mode (plan §5.1): WordPress behind a TLS-terminating proxy, the production image under
# /wp-upload/, and a dev CA that only the containers in this stack trust (§5.3).
#
# Hostnames inside the stack (network aliases of `proxy`):
#   https://wpu.test/wp-upload/       the app (production image), prefix stripped
#   https://wpu.test/wp-upload-mock/  the VITE_MOCK build from dev/.build/mock-dist
#   https://wp.wpu.test/              WordPress
services:
  wordpress:
    environment:
      # wp-config-extra.php points the WordPress HTTP API at this bundle (Mozilla roots plus the
      # dev CA), so loopback requests to https://wp.wpu.test verify.
      WPU_DEV_CA_BUNDLE: /run/wpu-ca/bundle.pem
    volumes:
      - ${WPU_STATE_DIR:?run this stack through dev/run}/ca/public:/run/wpu-ca:ro

  wpcli:
    environment:
      WPU_DEV_CA_BUNDLE: /run/wpu-ca/bundle.pem
    volumes:
      - ${WPU_STATE_DIR}/ca/public:/run/wpu-ca:ro

  runner:
    environment:
      # The runner's entrypoint adds the CA to Chromium's NSS database and builds a system
      # bundle for Node, curl and git.
      WPU_DEV_CA_CERT: /run/wpu-ca/ca.crt
      NODE_EXTRA_CA_CERTS: /run/wpu-ca/ca.crt
      WPU_APP_URL: https://wpu.test/wp-upload/
      WPU_MOCK_URL: https://wpu.test/wp-upload-mock/
      WPU_WP_URL: https://wp.wpu.test
      WPU_APP_USER: ${WPU_APP_USER:-}
      WPU_APP_PASSWORD: ${WPU_APP_PASSWORD:-}
      WPU_ADMIN_USER: ${WPU_ADMIN_USER:-}
      WPU_ADMIN_PASSWORD: ${WPU_ADMIN_PASSWORD:-}
      WPU_LOGIN_USER: ${WPU_LOGIN_USER:-}
      WPU_LOGIN_PASSWORD: ${WPU_LOGIN_PASSWORD:-}
    volumes:
      - ${WPU_STATE_DIR}/ca/public:/run/wpu-ca:ro

  proxy:
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      # For debugging from the host only (use curl --resolve and the dev CA). Nothing outside
      # the stack needs it.
      - "${WPU_BIND_ADDRESS:-127.0.0.1}:${WPU_PORT_PROXY:?run this stack through dev/run}:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WPU_STATE_DIR}/ca/proxy:/etc/nginx/tls:ro
      - ./.build/mock-dist:/srv/www/wp-upload-mock:ro
    networks:
      default:
        aliases:
          - wpu.test
          - wp.wpu.test
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The production image, built from the repo's own Dockerfile. The image is unchanged; the
  # CA arrives through NODE_EXTRA_CA_CERTS only.
  app:
    profiles: [app]
    image: wpu-app:${COMPOSE_PROJECT_NAME}
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      WP_URL: https://wp.wpu.test
      WP_USERNAME: ${WPU_APP_USER:-}
      WP_APP_PASSWORD: ${WPU_APP_PASSWORD:-}
      AUTH_USERNAME: ${WPU_LOGIN_USER:-}
      AUTH_PASSWORD: ${WPU_LOGIN_PASSWORD:-}
      SESSION_SECRET: ${WPU_SESSION_SECRET:-}
      # The proxy is the only hop in front of the app.
      TRUST_PROXY: "1"
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_EXTRA_CA_CERTS: /run/wpu-ca/ca.crt
      TZ: UTC
      LANG: C.UTF-8
    volumes:
      - ${WPU_STATE_DIR}/ca/public:/run/wpu-ca:ro
    healthcheck:
      # The image is distroless (no shell, no curl), so Node itself probes /healthz.
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
