# The `test` mode proxy (plan §5.1). Never used outside the dev/test stack.
#
#   https://wpu.test/wp-upload/       -> app:3001, prefix stripped (the "any sub-path" rule)
#   https://wpu.test/wp-upload-mock/  -> the VITE_MOCK build (static, dev/.build/mock-dist)
#   https://wp.wpu.test/              -> wordpress:80, TLS terminated here
#
# Upstreams are resolved per request through Docker's DNS, so the proxy starts (and keeps
# serving WordPress and the mock build) while `app` is still being built or isn't running.

resolver 127.0.0.11 valid=10s ipv6=off;

# Uploads are streamed and WordPress can take minutes to process images under load, so no
# body limit and long timeouts.
client_max_body_size 0;
proxy_request_buffering off;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
proxy_http_version 1.1;

ssl_certificate /etc/nginx/tls/server.crt;
ssl_certificate_key /etc/nginx/tls/server.key;
ssl_protocols TLSv1.2 TLSv1.3;

# Health check for Docker only (not published).
server {
  listen 8080;
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}

# Plain HTTP only redirects, like a typical TLS-terminating proxy. (WordPress builds http://
# URLs when it runs outside a request, e.g. from wp-cli.)
server {
  listen 80;
  server_name wpu.test wp.wpu.test;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name wpu.test;

  location = / {
    return 302 /wp-upload/;
  }

  location = /wp-upload {
    return 301 /wp-upload/;
  }

  location /wp-upload/ {
    set $app_upstream app:3001;
    rewrite ^/wp-upload/(.*)$ /$1 break;
    proxy_pass http://$app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /wp-upload;
  }

  location = /wp-upload-mock {
    return 301 /wp-upload-mock/;
  }

  # A single entry URL, like the real app: unknown paths fall back to index.html.
  location /wp-upload-mock/ {
    root /srv/www;
    try_files $uri /wp-upload-mock/index.html =404;
  }
}

server {
  listen 443 ssl;
  server_name wp.wpu.test;

  location / {
    set $wordpress_upstream wordpress:80;
    proxy_pass http://$wordpress_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }
}
